name: Publish launcher to npm

# Keeps `npm i -g vimo-oss` fresh automatically. After the Release workflow
# finishes on main, this checks whether the launcher version on main is
# already on npm — and publishes it (OIDC trusted publishing + provenance)
# when it isn't.
#
# Why `workflow_run` and not `release: published`: the Release workflow cuts
# tags and GitHub Releases with the default GITHUB_TOKEN, and GitHub
# deliberately does NOT start new workflow runs from token-triggered events —
# so a `release: published` trigger silently never fires for bot-made
# releases. Chaining off the Release run's *completion* sidesteps that.
#
# One-time owner setup (browser, 2 minutes, required once ever):
#   npmjs.com → vimo-oss package → Settings → Trusted Publisher → GitHub
#   Actions → organization Krish-1507, repository VIMO_OSS,
#   workflow file name npm-publish.yml, environment (none).
# Until that link exists this job fails with a clear OIDC error and changes
# nothing — releases, tags, and the app are unaffected.
#
# No tokens are stored: authentication is short-lived OIDC (`id-token: write`).

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish vimo-oss
    # Only after a successful Release run, and only for the main branch.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Non-negotiable: OIDC trusted publishing (registry auth without any
      # stored token) requires npm 11.5+, but Node 20 ships npm 10 — which can
      # *sign* provenance yet still PUTs with whatever bearer it finds,
      # producing the exact misleading registry 404 we chased. npm@11 is the
      # newest line that still runs on Node 20 (npm@12 needs Node 22+).
      - name: Use npm 11 for OIDC publishing
        run: npm install -g npm@11 && npm --version

      - name: Verify launcher (lint + smoke tests)
        run: |
          node --check bin/vimo.mjs
          node --test tests/*.test.mjs

      - name: Skip if this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view vimo-oss versions --json | grep -q "\"$VERSION\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "vimo-oss@$VERSION is already on npm — nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "vimo-oss@$VERSION is new — publishing."
          fi

      # Auth strategy, in order:
      #   1. NPM_TOKEN secret (classic "Automation" token, 2FA-proof) when the
      #      owner has set one — fully deterministic, debuggable (401 = bad
      #      token, never a mystery 404).
      #   2. Otherwise OIDC trusted publishing. The userconfig is rewritten
      #      from scratch first: a stale NODE_AUTH_TOKEN lingering in the
      #      environment shadows OIDC and produces a misleading registry 404,
      #      which is exactly what a bare `npm publish` tripped over.
      - name: Publish to npm with provenance
        run: |
          USERCONFIG="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -n "${NPM_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\n' "${NPM_TOKEN}" > "$USERCONFIG"
            npm publish --provenance --access public
          else
            printf 'registry=https://registry.npmjs.org/\n' > "$USERCONFIG"
            npm publish --provenance --access public
          fi
        env:
          # Absent unless the owner adds it (see CONTRIBUTING → Releasing).
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
