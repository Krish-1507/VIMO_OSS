name: CI

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # One job does typecheck + build + the two source-hygiene gates. Splitting
  # these into separate jobs only duplicated the checkout/setup/install steps
  # (each ~1 min of npm ci) for zero extra signal.
  verify:
    name: Verify (typecheck, build, banned-words, silent-catches)
    runs-on: ubuntu-latest
    env:
      ENCRYPTION_KEY: ci-test-encryption-key-32chars-long!!
      NODE_ENV: test
      # CI has no LLM keys: skip the built-in free tier (dead + slow) so the
      # Director pipeline uses instant template fallbacks instead of network retries.
      VIMO_DISABLE_BUILTIN_LLM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run lint

      - name: Build all workspaces (shared, backend, frontend)
        run: npm run build

      - name: Banned words check
        run: node scripts/check-banned-words.mjs

      - name: Silent catch check
        run: npm run check:catches

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist
          retention-days: 7

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    needs: [verify]
    env:
      ENCRYPTION_KEY: ci-test-encryption-key-32chars-long!!
      NODE_ENV: test
      # CI has no LLM keys: skip the built-in free tier (dead + slow) so the
      # Director pipeline uses instant template fallbacks instead of network retries.
      VIMO_DISABLE_BUILTIN_LLM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test --workspace=packages/frontend

      - name: Test backend (with coverage gate)
        run: npm run test:coverage --workspace=packages/backend

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: packages/backend/coverage
          retention-days: 7

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [verify]
    env:
      ENCRYPTION_KEY: ci-test-encryption-key-32chars-long!!
      NODE_ENV: test
      # CI has no LLM keys: skip the built-in free tier (dead + slow) so the
      # Director pipeline uses instant template fallbacks instead of network retries.
      VIMO_DISABLE_BUILTIN_LLM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the browser download — the install step is the slow part of E2E,
      # and a hit here shaves minutes off every PR run.
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke e2e (boot -> Demo brand -> run Director)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
